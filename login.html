<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Letra Viva</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="menu">
    <a href="index.html" class="logo logo-menu"><i class="ti ti-feather"></i> Letra <span class="viva">Viva</span></a>
    <a href="index.html"><i class="ti ti-home"></i> <span>Inicio</span></a>
    <a href="favoritos.html"><i class="ti ti-heart"></i> <span>Favoritos</span></a>
    <a href="explorar.html"><i class="ti ti-search lupa"></i> <span>Explorar</span></a>
    <a href="notificaciones.html"><i class="ti ti-bell"></i> <span>Notificaciones</span></a>
    <a href="perfil.html"><i class="ti ti-user"></i> <span>Perfil</span></a>
  </nav>

  <div class="contenido">
    <header class="barra-superior">
      <a href="index.html" class="logo logo-movil"><i class="ti ti-feather"></i> Letra <span class="viva">Viva</span></a>
    </header>

    <main>
      <form class="formulario" action="index.html">
        <h1>Inicia sesión</h1>
        <p class="formulario-sub">Tu próxima lectura te espera.</p>

        <label class="campo">
          <span>Correo electrónico</span>
          <input type="email" placeholder="hola@ejemplo.com" required>
        </label>

        <label class="campo">
          <span>Contraseña</span>
          <input type="password" placeholder="Tu contraseña" required>
        </label>

        <button type="submit" class="boton">Iniciar sesión</button>

        <p class="aviso-registro">¿Primera vez aquí? <a href="registro.html">Crea una cuenta</a></p>
      </form>
    </main>
  </div>

</body>
</html>
